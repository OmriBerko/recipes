<!doctype html>
<html lang="he" dir="rtl">

<title>מה מבשלים</title>

<meta name="apple-mobile-web-app-title" content="מה מבשלים">

<style>
:root {
  --bg: #f7f1e8; --card: #fffdf9; --ink: #2b241c; --muted: #7a6d5e;
  --line: #e7dccb; --accent: #c2541b; --accent-soft: #f6e0d2;
  --tried: #2f7a4a; --tried-soft: #dcefe2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1915; --card: #26221d; --ink: #f1e9dd; --muted: #a8998a;
    --line: #3a342c; --accent: #f08a4b; --accent-soft: #3d2a1d;
    --tried: #7fcf98; --tried-soft: #1f3528;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1915; --card: #26221d; --ink: #f1e9dd; --muted: #a8998a;
  --line: #3a342c; --accent: #f08a4b; --accent-soft: #3d2a1d;
  --tried: #7fcf98; --tried-soft: #1f3528;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.6 -apple-system, "Segoe UI", "Rubik", "Arial Hebrew", Arial, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
a { color: var(--accent); }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
header {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 14px) 0 10px; border-bottom: 1px solid var(--line);
}
h1 { font-size: 26px; margin: 0 0 10px; letter-spacing: -.3px; }
h1 small { font-size: 14px; color: var(--muted); font-weight: 400; margin-inline-start: 6px; }
input[type=search] {
  width: 100%; font: inherit; padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
}
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.list { list-style: none; padding: 12px 0 40px; margin: 0; display: grid; gap: 10px; }
.card {
  display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
}
.card .emoji { font-size: 30px; line-height: 1; }
.card .title { font-weight: 600; line-height: 1.3; }
.meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--tried-soft); color: var(--tried); font-weight: 600; }
.badge.new { background: var(--accent-soft); color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }

/* recipe page */
.recipe { padding: 8px 0 60px; }
.bar { display: flex; gap: 8px; align-items: center; padding: calc(env(safe-area-inset-top) + 10px) 0 6px; }
.btn {
  font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 7px 12px; border-radius: 10px; cursor: pointer; text-decoration: none;
}
.btn[aria-pressed="true"] { background: var(--tried); color: #fff; border-color: var(--tried); }
.spacer { flex: 1; }
.recipe h1 { font-size: 28px; line-height: 1.25; margin: 10px 0 6px; }
.recipe .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.recipe .tags span { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
.recipe h2 { font-size: 21px; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--accent-soft); }
.recipe h3 { font-size: 16px; margin: 16px 0 4px; color: var(--accent); }
.recipe ul, .recipe ol { padding-inline-start: 22px; margin: 6px 0; }
.recipe li { margin: 4px 0; }
.recipe ol li { margin: 10px 0; padding-inline-start: 4px; }
.recipe ol li::marker { color: var(--accent); font-weight: 700; }
ul.ingredients { list-style: none; padding: 0; }
ul.ingredients li {
  padding: 8px 10px; margin: 0; border-bottom: 1px solid var(--line); cursor: pointer;
  display: flex; gap: 10px; align-items: flex-start; -webkit-tap-highlight-color: transparent;
}
ul.ingredients li::before {
  content: ""; flex: none; width: 18px; height: 18px; margin-top: 4px;
  border: 2px solid var(--line); border-radius: 5px;
}
ul.ingredients li.done { color: var(--muted); text-decoration: line-through; }
ul.ingredients li.done::before { background: var(--tried); border-color: var(--tried); }
table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 12px 0; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: start; }
th { background: var(--accent-soft); }
.source { color: var(--muted); font-size: 14px; margin-top: 28px; word-break: break-all; }
.hint { color: var(--muted); font-size: 13px; }
</style>
</head>

 שהרוטב כבר מעורבב עם הפסטה.\n"}, {"id": "lasagna-basar", "title": "לזניה עם בשר טחון ובשמל", "emoji": "🍝", "tags": ["בשר", "פסטה", "תנור", "לילדים", "למבוגרים"], "time": "כשעה וחצי", "servings": "⁦6–8⁩", "source": "", "status": "tried", "html": "<h2>מצרכים<\/h2>\n<h3>לרוטב הבשר<\/h3>\n<ul class=\"ingredients\"><li>⁦500–600⁩ גרם בשר בקר טחון<\/li><li>1 בצל גדול קצוץ דק<\/li><li>2 שיני שום כתושות<\/li><li>2 כפות שמן זית<\/li><li>⁦700–800⁩ גרם עגבניות מרוסקות<\/li><li>2 כפות רסק עגבניות<\/li><li>½ כוס מים<\/li><li>1 כפית אורגנו<\/li><li>½ כפית בזיליקום יבש (אם יש)<\/li><li>מלח ופלפל<\/li><li>גזר אחד מגורד דק (לא חובה, מצוין לילדים)<\/li><\/ul>\n<h3>לבשמל<\/h3>\n<ul class=\"ingredients\"><li>60 גרם חמאה<\/li><li>4 כפות קמח<\/li><li>600 מ״ל חלב<\/li><li>מעט מלח<\/li><li>מעט אגוז מוסקט (לא חובה)<\/li><li>⁦50–70⁩ גרם פרמזן מגורד<\/li><\/ul>\n<h3>בנוסף<\/h3>\n<ul class=\"ingredients\"><li>⁦9–12⁩ דפי לזניה, לפי התבנית<\/li><li>⁦150–200⁩ גרם מוצרלה מגורדת<\/li><li>עוד מעט פרמזן למעלה<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li><strong>רוטב בשר:<\/strong> מטגנים בצל בשמן זית ⁦4–5⁩ דקות. מוסיפים שום ואז את הבשר, ומטגנים תוך פירוק עד שהוא משנה צבע ומשחים.<\/li><li>מוסיפים עגבניות מרוסקות, רסק, מים, אורגנו, מלח, פלפל, וגזר אם משתמשים. מבשלים על אש נמוכה ⁦20–30⁩ דקות, עד שהרוטב סמיך יחסית.<\/li><li><strong>בשמל:<\/strong> ממיסים חמאה בסיר, מוסיפים קמח ומערבבים כדקה. מוסיפים חלב בהדרגה תוך טריפה, בלי גושים. מבשלים ומערבבים ⁦5–7⁩ דקות עד שמסמיך. מכבים ומערבבים פרמזן, מלח ומוסקט.<\/li><li><strong>מרכיבים:<\/strong> מעט רוטב בשר בתחתית, ואז דפי לזניה ← רוטב בשר ← בשמל ← מעט מוצרלה. חוזרים ⁦2–3⁩ פעמים. מסיימים בדפי לזניה, בשמל, מוצרלה ופרמזן.<\/li><li><strong>אופים:<\/strong> מכסים בנייר כסף, 180°C כ־30 דקות. מסירים את הכיסוי ואופים עוד ⁦15–20⁩ דקות, עד שהחלק העליון זהוב ומבעבע.<\/li><li><strong>חשוב:<\/strong> נותנים לנוח ⁦10–15⁩ דקות לפני החיתוך, אחרת הלזניה מתפרקת.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li><strong>לילדים:<\/strong> רוטב עדין, בלי חריף ובלי הרבה פלפל, עם גזר מגורד. הוא כמעט נעלם ומוסיף מתיקות.<\/li><\/ul>", "text": "\n   מצרכים\n\n    לרוטב הבשר\n\n  500–600 גרם בשר בקר טחון\n  1 בצל גדול קצוץ דק\n  2 שיני שום כתושות\n  2 כפות שמן זית\n  700–800 גרם עגבניות מרוסקות\n  2 כפות רסק עגבניות\n  ½ כוס מים\n  1 כפית אורגנו\n  ½ כפית בזיליקום יבש (אם יש)\n  מלח ופלפל\n  גזר אחד מגורד דק (לא חובה, מצוין לילדים)\n\n    לבשמל\n\n  60 גרם חמאה\n  4 כפות קמח\n  600 מ״ל חלב\n  מעט מלח\n  מעט אגוז מוסקט (לא חובה)\n  50–70 גרם פרמזן מגורד\n\n    בנוסף\n\n  9–12 דפי לזניה, לפי התבנית\n  150–200 גרם מוצרלה מגורדת\n  עוד מעט פרמזן למעלה\n\n   אופן ההכנה\n\n1.   רוטב בשר:   מטגנים בצל בשמן זית 4–5 דקות. מוסיפים שום ואז את הבשר, ומטגנים תוך פירוק עד שהוא משנה צבע ומשחים.\n2. מוסיפים עגבניות מרוסקות, רסק, מים, אורגנו, מלח, פלפל, וגזר אם משתמשים. מבשלים על אש נמוכה 20–30 דקות, עד שהרוטב סמיך יחסית.\n3.   בשמל:   ממיסים חמאה בסיר, מוסיפים קמח ומערבבים כדקה. מוסיפים חלב בהדרגה תוך טריפה, בלי גושים. מבשלים ומערבבים 5–7 דקות עד שמסמיך. מכבים ומערבבים פרמזן, מלח ומוסקט.\n4.   מרכיבים:   מעט רוטב בשר בתחתית, ואז דפי לזניה ← רוטב בשר ← בשמל ← מעט מוצרלה. חוזרים 2–3 פעמים. מסיימים בדפי לזניה, בשמל, מוצרלה ופרמזן.\n5.   אופים:   מכסים בנייר כסף, 180°C כ־30 דקות. מסירים את הכיסוי ואופים עוד 15–20 דקות, עד שהחלק העליון זהוב ומבעבע.\n6.   חשוב:   נותנים לנוח 10–15 דקות לפני החיתוך, אחרת הלזניה מתפרקת.\n\n   טיפים\n\n    לילדים:   רוטב עדין, בלי חריף ובלי הרבה פלפל, עם גזר מגורד. הוא כמעט נעלם ומוסיף מתיקות.\n"}, {"id": "mujadara", "title": "מג׳דרה אורז ועדשים ירוקות", "emoji": "🍚", "tags": ["צמחוני", "טבעוני", "סיר אחד", "לילדים", "למבוגרים"], "time": "כשעה", "servings": "6", "source": "", "status": "tried", "html": "<p>הסוד: לבשל את העדשים מראש, כדי שיהיו רכות, והרבה בצל מטוגן ומקורמל.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>1 כוס עדשים ירוקות (רצוי להשרות שעה, לא חובה)<\/li><li>1.5 כוסות אורז לבן (פרסי, יסמין או בסמטי), שטוף ומסונן<\/li><li>3 בצלים גדולים<\/li><li>⁦4–5⁩ כפות שמן זית (או קנולה)<\/li><li>1 כפית כמון<\/li><li>½ כפית כורכום (לא חובה, לצבע)<\/li><li>1.5 כפיות מלח<\/li><li>¼ כפית פלפל שחור גרוס<\/li><li>3 כוסות מים רותחים<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li><strong>עדשים:<\/strong> מבשלים בסיר קטן עם הרבה מים, כמו פסטה, ⁦20–25⁩ דקות על אש בינונית. רכות ונגיסות, לא דייסתיות. מסננים.<\/li><li><strong>בצל:<\/strong> פורסים לרצועות דקות (או קוצצים דק, כדי שלא יורגש — טוב לבררנים). מטגנים בשמן בסיר רחב על אש בינונית־נמוכה ⁦15–20⁩ דקות, עד צבע זהוב־חום עמוק. אפשר לשמור כף־שתיים לקישוט.<\/li><li><strong>אורז:<\/strong> מוסיפים לסיר ומטגנים יחד ⁦2–3⁩ דקות, עד שהאורז מעט שקוף.<\/li><li><strong>עדשים ותבלינים:<\/strong> מוסיפים עדשים, כמון, כורכום, מלח ופלפל, ומערבבים בעדינות.<\/li><li><strong>בישול:<\/strong> מוסיפים 3 כוסות מים רותחים, מביאים לרתיחה קלה, מנמיכים לאש הכי נמוכה ומכסים במכסה אטום. מבשלים בדיוק 20 דקות.<\/li><li><strong>מנוחה:<\/strong> מכבים ומשאירים סגור עוד 10 דקות.<\/li><li>מאווררים בעדינות במזלג ומגישים.<\/li><\/ol>", "text": "\nהסוד: לבשל את העדשים מראש, כדי שיהיו רכות, והרבה בצל מטוגן ומקורמל.\n\n   מצרכים\n\n  1 כוס עדשים ירוקות (רצוי להשרות שעה, לא חובה)\n  1.5 כוסות אורז לבן (פרסי, יסמין או בסמטי), שטוף ומסונן\n  3 בצלים גדולים\n  4–5 כפות שמן זית (או קנולה)\n  1 כפית כמון\n  ½ כפית כורכום (לא חובה, לצבע)\n  1.5 כפיות מלח\n  ¼ כפית פלפל שחור גרוס\n  3 כוסות מים רותחים\n\n   אופן ההכנה\n\n1.   עדשים:   מבשלים בסיר קטן עם הרבה מים, כמו פסטה, 20–25 דקות על אש בינונית. רכות ונגיסות, לא דייסתיות. מסננים.\n2.   בצל:   פורסים לרצועות דקות (או קוצצים דק, כדי שלא יורגש — טוב לבררנים). מטגנים בשמן בסיר רחב על אש בינונית־נמוכה 15–20 דקות, עד צבע זהוב־חום עמוק. אפשר לשמור כף־שתיים לקישוט.\n3.   אורז:   מוסיפים לסיר ומטגנים יחד 2–3 דקות, עד שהאורז מעט שקוף.\n4.   עדשים ותבלינים:   מוסיפים עדשים, כמון, כורכום, מלח ופלפל, ומערבבים בעדינות.\n5.   בישול:   מוסיפים 3 כוסות מים רותחים, מביאים לרתיחה קלה, מנמיכים לאש הכי נמוכה ומכסים במכסה אטום. מבשלים בדיוק 20 דקות.\n6.   מנוחה:   מכבים ומשאירים סגור עוד 10 דקות.\n7. מאווררים בעדינות במזלג ומגישים.\n"}, {"id": "mukpatz-yerakot-yeladim", "title": " פן ההכנה\n\n1.   טופו (אם משתמשים):   חותכים לקוביות קטנות. מטגנים במעט שמן 4–6 דקות, תוך ערבוב, עד שהן מזהיבות. מוציאים לצלחת.\n2. מחממים מחבת רחבה או ווק עם שמן זית.\n3. מטגנים את הבצל 2–3 דקות, עד שהוא מתחיל להתרכך.\n4. מוסיפים גזר וגמבה ומטגנים עוד 3–4 דקות.\n5. מוסיפים פטריות ומטגנים עד שהן משחררות נוזלים ומצטמצמות.\n6. מוסיפים אפונה ותירס, ומחזירים את הטופו. אם צריך, מוסיפים 2–3 כפות מים כדי לרכך.\n7. מתבלים בסויה (או מלח) וסילאן, ומבשלים עוד 3–4 דקות, עד שהכול רך אבל לא מושי.\n\n   טיפים\n\n    הגשה:   עם אטריות אורז קטנות, אורז לבן, או חביתה קצוצה בפנים.\n    בת 3:   קוביות טופו קטנות ורכות, כפית סויה וכפית סילאן. המתיקות של התירס והגזר עובדת מצוין.\n  התחלת כבר את הירקות? אפשר להכניס את הטופו ישר יחד עם האפונה והתירס ולבשל כ־5 דקות.\n"}, {"id": "marak-of", "title": "מרק עוף ביתי עם ירקות", "emoji": "🍜", "tags": ["עוף", "מרק", "חורף", "לילדים", "למבוגרים"], "time": "כשעה וחצי", "servings": "⁦5–6⁩", "source": "https://www.kipa.co.il/%D7%90%D7%95%D7%9B%D7%9C/1212710-0/", "status": "tried", "html": "<p>מרק עוף קלאסי עם ציר זהוב. מגישים עם אטריות, אורז או שקדי מרק.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>⁦3–4⁩ שוקיים או כרעיים של עוף<\/li><li>3 גזרים קלופים וחתוכים גס<\/li><li>2 תפוחי אדמה קלופים, בקוביות גדולות<\/li><li>2 קישואים חתוכים גס<\/li><li>1 בצל גדול קלוף (אפשר שלם)<\/li><li>2 גבעולי סלרי עם העלים<\/li><li>½ צרור פטרוזיליה<\/li><li>½ צרור שמיר (לא חובה, אבל מוסיף הרבה טעם)<\/li><li>2 שיני שום קלופות<\/li><li>1 כפית כורכום<\/li><li>מלח ופלפל שחור לפי הטעם<\/li><li>⁦2.5–3⁩ ליטר מים<\/li><li>כף שמן זית (לא חובה)<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li><strong>עוף:<\/strong> מכסים את חלקי העוף במים קרים בסיר גדול. מביאים לרתיחה ומסירים את הקצף שעולה, למרק צלול.<\/li><li><strong>ירקות:<\/strong> מוסיפים בצל, גזר, תפוחי אדמה, שום וסלרי. מתבלים בכורכום, מלח ומעט פלפל.<\/li><li><strong>בישול איטי:<\/strong> רתיחה עדינה, מכסים חלקית ומבשלים כ־45 דקות.<\/li><li><strong>ירקות עדינים:<\/strong> מוסיפים קישואים, פטרוזיליה ושמיר, וממשיכים ⁦30–40⁩ דקות על אש נמוכה.<\/li><li><strong>מגישים:<\/strong> מתקנים תיבול. אפשר לפרק את העוף מהעצמות ולהחזיר את הבשר למרק.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li>כרעיים עם עצם ועור נותנים ציר עשיר יותר.<\/li><li>בעבוע עדין, לא רתיחה חזקה, שומר על מרק צלול.<\/li><li><strong>לילדים:<\/strong> עוף מפורק לחתיכות קטנות בלי עצמות, עם גזר ותפוחי אדמה מעוכים מעט.<\/li><li>אטריות מבשלים בנפרד, כדי שלא יספגו את כל הנוזלים.<\/li><li>שורש פטרוזיליה או חתיכת שורש סלרי מוסיפים עומק.<\/li><\/ul>", "text": "\nמרק עוף קלאסי עם ציר זהוב. מגישים עם אטריות, אורז או שקדי מרק.\n\n   מצרכים\n\n  3–4 שוקיים או כרעיים של עוף\n  3 גזרים קלופים וחתוכים גס\n  2 תפוחי אדמה קלופים, בקוביות גדולות\n  2 קישואים חתוכים גס\n  1 בצל גדול קלוף (אפשר שלם)\n  2 גבעולי סלרי עם העלים\n  ½ צרור פטרוזיליה\n  ½ צרור שמיר (לא חובה, אבל מוסיף הרבה טעם)\n  2 שיני שום קלופות\n  1 כפית כורכום\n  מלח ופלפל שחור לפי הטעם\n  2.5–3 ליטר מים\n  כף שמן זית (לא חובה)\n\n   אופן ההכנה\n\n1.   עוף:   מכסים את חלקי העוף במים קרים בסיר גדול. מביאים לרתיחה ומסירים את הקצף שעולה, למרק צלול.\n2.   ירקות:   מוסיפים בצל, גזר, תפוחי אדמה, שום וסלרי. מתבלים בכורכום, מלח ומעט פלפל.\n3.   בישול איטי:   רתיחה עדינה, מכסים חלקית ומבשלים כ־45 דקות.\n4.   ירקות עדינים:   מוסיפים קישואים, פטרוזיליה ושמיר, וממשיכים 30–40 דקות על אש נמוכה.\n5.   מגישים:   מתקנים תיבול. אפשר לפרק את העוף מהעצמות ולהחזיר את הבשר למרק.\n\n   טיפים\n\n  כרעיים עם עצם ועור נותנים ציר עשיר יותר.\n  בעבוע עדין, לא רתיחה חזקה, שומר על מרק צלול.\n    לילדים:   עוף מפורק לחתיכות קטנות בלי עצמות, עם גזר ותפוחי אדמה מעוכים מעט.\n  אטריות מבשלים בנפרד, כדי שלא יספגו את כל הנוזלים.\n  שורש פטרוזיליה או חתיכת שורש סלרי מוסיפים עומק.\n"}, {"id": "steak-pargit-ninja", "title": "סטייק פרגית עסיסי בנינג׳ה", "emoji": "🍗", "tags": ["עוף", "נינג׳ה", "מהיר", "לילדים", "למבוגרים"], "time": "20 דקות", "servings": "⁦3–4⁩", "source": "https://delishably.com", "status": "tried", "html": "<p>תיבול מתקתק־מלוח, צריבה יפה מבחוץ ועסיסיות מבפנים. בנינג׳ה גריל או באייר פרייר.<\/p>\n<h2>מצרכים<\/h2>\n< מן  \n             \n  Ninja Grill – תוכנית Grill   Medium–High   10–14 דקות  \n  Ninja Air Fryer – תוכנית Air Fry   190°C   12–16 דקות  \n\nהעוף מוכן כשהטמפרטורה במרכז החלק העבה מגיעה ל־74°C.\n\n   טיפים\n\n  לא לבשל יותר מהנדרש. אם הפרגית דקה, בודקים כבר אחרי 9–10 דקות.\n"}, {"id": "spaghetti-meatballs", "title": "ספגטי מיטבולס – כדורי בשר ברוטב עגבניות", "emoji": "🍝", "tags": ["בשר", "פסטה", "לילדים"], "time": "45 דקות", "servings": "4", "source": "https://themodernproper.com/spaghetti-and-meatballs", "status": "tried", "html": "<p>כדורי בשר רכים ועסיסיים ברוטב עגבניות עשיר, בסגנון איטלקי.<\/p>\n<h2>מצרכים<\/h2>\n<h3>לכדורי הבשר<\/h3>\n<ul class=\"ingredients\"><li>500 גרם בשר בקר טחון<\/li><li>1 ביצה<\/li><li>½ בצל מגורד דק<\/li><li>2 שיני שום כתושות<\/li><li>3 כפות פירורי לחם<\/li><li>2 כפות פטרוזיליה קצוצה (לא חובה)<\/li><li>½ כפית מלח<\/li><li>¼ כפית פלפל שחור<\/li><li>1 כף שמן זית<\/li><\/ul>\n<h3>לרוטב העגבניות<\/h3>\n<ul class=\"ingredients\"><li>2 כפות שמן זית<\/li><li>1 בצל קטן קצוץ<\/li><li>3 שיני שום כתושות<\/li><li>2 כפות רסק עגבניות<\/li><li>1 קופסה (400 גרם) עגבניות מרוסקות<\/li><li>1 כוס מים<\/li><li>1 כפית סוכר (רק אם הרוטב חמצמץ)<\/li><li>½ כפית פפריקה מתוקה<\/li><li>½ כפית אורגנו או בזיליקום יבש<\/li><li>מלח ופלפל לפי הטעם<\/li><\/ul>\n<h3>בנוסף<\/h3>\n<ul class=\"ingredients\"><li>⁦400–500⁩ גרם ספגטי<\/li><li>פרמזן מגורד להגשה (לא חובה)<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li><strong>מכינים את כדורי הבשר:<\/strong> מערבבים בקערה את כל חומרי הכדורים עד שהתערובת אחידה. לא ללוש יותר מדי, כדי שיישארו רכים. יוצרים כדורים בגודל כדור פינג־פונג, בערך ⁦18–22⁩ כדורים.<\/li><li><strong>צורבים:<\/strong> מחממים מעט שמן במחבת עמוקה או בסיר רחב וצורבים את הכדורים ⁦4–5⁩ דקות, תוך סיבוב עדין, עד שהם משחימים מבחוץ. מוציאים לצלחת. הם לא צריכים להיות מוכנים מבפנים.<\/li><li><strong>מכינים את הרוטב:<\/strong> באותו סיר מטגנים את הבצל ⁦3–4⁩ דקות עד שהוא מתרכך. מוסיפים שום ומערבבים כחצי דקה. מוסיפים רסק ומטגנים עוד דקה. מוסיפים עגבניות מרוסקות, מים, תבלינים, וסוכר אם צריך. מביאים לרתיחה עדינה.<\/li><li><strong>מבשלים את המיטבולס ברוטב:<\/strong> מחזירים את הכדורים לרוטב, מכסים חלקית ומבשלים על אש נמוכה ⁦20–25⁩ דקות. מדי פעם מנערים את הסיר בעדינות. אם הרוטב סמיך מדי, מוסיפים מעט מים.<\/li><li><strong>ספגטי והגשה:<\/strong> מבשלים ספגטי במים מומלחים עד אל דנטה. שומרים חצי כוס ממי הבישול ומסננים. מערבבים את הספגטי עם מעט רוטב ומי בישול לפי הצורך, ומגישים עם הכדורים ושאר הרוטב מעל.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li><strong>כדורים רכים במיוחד:<\/strong> משרים את פירורי הלחם ב־⁦2–3⁩ כפות מים לפני שמערבבים עם הבשר.<\/li><li><strong>רוטב עשיר יותר:<\/strong> לא לוותר על הצריבה. המשקעים בתחתית הסיר מוסיפים המון טעם.<\/li><li><strong>לילדים:<\/strong> מגרדים חצי גזר לרוטב ומבשלים אותו עם הבצל. מוסיף מתיקות, וכמעט לא מרגישים אותו.<\/li><\/ul>", "text": "\nכדורי בשר רכים ועסיסיים ברוטב עגבניות עשיר, בסגנון איטלקי.\n\n   מצרכים\n\n    לכדורי הבשר\n\n  500 גרם בשר בקר טחון\n  1 ביצה\n  ½ בצל מגורד דק\n  2 שיני שום כתושות\n  3 כפות פירורי לחם\n  2 כפות פטרוזיליה קצוצה (לא חובה)\n  ½ כפית מלח\n  ¼ כפית פלפל שחור\n  1 כף שמן זית\n\n    לרוטב העגבניות\n\n  2 כפות שמן זית\n  1 בצל קטן קצוץ\n  3 שיני שום כתושות\n  2 כפות רסק עגבניות\n  1 קופסה (400 גרם) עגבניות מרוסקות\n  1 כוס מים\n  1 כפית סוכר (רק אם הרוטב חמצמץ)\n  ½ כפית פפריקה מתוקה\n  ½ כפית אורגנו או בזיליקום יבש\n  מלח ופלפל לפי הטעם\n\n    בנוסף\n\n  400–500 גרם ספגטי\n  פרמזן מגורד להגשה (לא חובה)\n\n   אופן ההכנה\n\n1.   מכינים את כדורי הבשר:   מערבבים בקערה את כל חומרי הכדורים עד שהתערובת אחידה. לא ללוש יותר מדי, כדי שיישארו רכים. יוצרים כדורים בגודל כדור פינג־פונג, בערך 18–22 כדורים.\n2.   צורבים:   מחממים מעט שמן במחבת עמוקה או בסיר רחב וצורבים את הכדורים 4–5 דקות, תוך סיבוב עדין, עד שהם משחימים מבחוץ. מוציאים לצלחת. הם לא צריכים להיות מוכנים מבפנים.\n3.   מכינים את הרוטב:   באותו סיר מטגנים את הבצל 3–4 דקות עד שהוא מתרכך. מוסיפים שום ומערבבים כחצי דקה. מוסיפים רסק ומטגנים עוד דקה. מוסיפים עגבניות מרוסקות, מים, תבלינים, וסוכר אם צריך. מביאים לרתיחה עדינה.\n4.   מבשלים את המיטבולס ברוטב:   מחזירים את הכדורים לרוטב, מכסים חלקית ומבשלים על אש נמוכה 20–25 דקות. מדי פעם מנערים את הסיר בעדינות. אם הרוטב סמיך מדי, מוסיפים מעט מים.\n5.   ספגטי והגשה:   מבשלים ספגטי במים מומלחים עד אל דנטה. שומרים חצי כוס ממי הבישול ומסננים. מערבבים את הספגטי עם מעט רוטב ומי בישול לפי הצורך, ומגישים עם הכדורים ושאר הרוטב מעל.\n\n   טיפים\n\n    כדורים רכים במיוחד:   משרים את פירורי הלחם ב־2–3 כפות מים לפני שמערבבים עם הבשר.\n    רוטב עשיר יותר:   לא לוותר על הצריבה. המשקעים בתחתית הסיר מוסיפים המון טעם.\n    לילדים:   מגרדים חצי גזר לרוטב ומבשלים אותו עם הבצל. מוסיף מתיקות, וכמעט לא מרגישים אותו.\n"}, {"id": "of-tanur-tapuhei-adama", "title": "עוף בתנור עם תפוחי אדמה", "emoji": "🍗", "tags": ["עוף", "תנור", "תבנית אחת", "לילדים", "למבוגרים"], "time": "כשעה וחצי", "servings": "4", "source": "", "status": "tried", "html": "<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>⁦4–6⁩ שוקיים או כרעיים של עוף<\/li><li>⁦4–5⁩ תפוחי אדמה<\/li><li>1 בצל (לא חובה)<\/li><li>3 כפות שמן זית<\/li><li>1 כפית פפריקה מתוקה<\/li><li>½ כפית כורכום<\/li><li>½ כפית שום גבישי, או 2 שיני שום כתושות (לא חובה)<\/li><li>מלח<\/li><li>מעט פלפל שחור<\/li><li>½ כוס מים<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li>מחממים תנור ל־200°C.<\/li><li>חותכים את תפוחי האדמה לקוביות או לפלחים בינוניים.<\/li><li>מסדרים בתבנית תפוחי אדמה, בצל ועוף.<\/li><li>מוסיפים שמן, פפריקה, כורכום, שום, מלח ופלפל, ומערבבים שהכול יהיה מצופה.<\/li><li>מוסיפים חצי כוס מים לתחתית התבנית.<\/li><li>מכסים בנייר כסף ואופים כ־45 דקות.<\/li><li>מסירים את הכיסוי ואופים עוד ⁦30–40⁩ דקות, עד שהעוף שחום ותפוחי האדמה רכים.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li>בחלק האחרון, הופכים או מערבבים את תפוחי האדמה כדי שיספגו מהרוטב של העוף.<\/li><\/ul>", "text": "\n   מצרכים\n\n  4–6 שוקיים או כרעיים של עוף\n  4–5 תפוחי אדמה\n  1 בצל (לא חובה)\n  3 כפות שמן זית\n  1 כפית פפריקה מתוקה\n  ½ כפית כורכום\n  ½ כפית שום גבישי, או 2 שיני שום כתושות (לא חובה)\n  מלח\n  מעט פלפל שחור\n  ½ כוס מים\n\n   אופן ההכנה\n\n1. מחממים תנור ל־200°C.\n2. חותכים את תפוחי האדמה לקוביות או לפלחים בינוניים.\n3. מסדרים בתבנית תפוחי אדמה, בצל ועוף.\n4. מוסיפים שמן, פפריקה, כורכום, שום, מלח ופלפל, ומערבבים שהכול יהיה מצופה.\n5. מוסיפים חצי כוס מים לתחתית התבנית.\n6. מכסים בנייר כסף ואופים כ־45 דקות.\n7. מסירים את הכיסוי ואופים עוד 30–40 דקות, עד שהעוף שחום ותפוחי האדמה רכים.\n\n   טיפים\n\n  בחלק האחרון, הופכים או מערבבים את תפוחי האדמה כדי שיספגו מהרוטב של העוף.\n"}, {"id": "pasta-shamenet-pitriyot", "title": "פסטה ברוטב שמנת פטריות", "emoji": "🍄", "tags": ["צמחוני", "פסטה", "מהיר", "לילדים", "למבוגרים"], "time": "20 דקות", "servings": "⁦1–2⁩", "source": "", "status": "tried", "html": "<p>רוטב עדין שמתאים גם לילדים. הכמות היא לרבע חבילת פסטה (125 גרם). להכפיל לפי הצורך.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>125 גרם פסטה<\/li><li>⁦100–120⁩ גרם פטריות שמפיניון (⁦4–5⁩ פטריות)<\/li><li>100 מ״ל שמנת לבישול<\/li><li>1 שן שום קטנה כתושה<\/li><li>1 כף חמאה או שמן זית<\/li><li>2 כפות פרמזן מגורד (לא חובה)<\/li><li>מעט מלח<\/li><li>קורט פלפל שחור (לא חובה)<\/li><li>⁦2–3⁩ כפות ממי בישול הפסטה<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li><strong>פסטה:<\/strong> מבשלים במים מומלחים לפי ההוראות. שומרים מעט ממי הבישול לפני הסינון.<\/li><li><strong>פטריות:<\/strong> פורסים דק. מחממים חמאה במחבת ומטגנים ⁦5–6⁩ דקות על אש בינונית־גבוהה, עד שהן מתרככות ומשחימות מעט.<\/li><li><strong>שום:<\/strong> מוסיפים ומערבבים כ־30 שניות.<\/li><li><strong>רוטב:<\/strong> מנמיכים לאש קטנה, מוסיפים שמנת, מלח ופלפל, ומבשלים ⁦3–4⁩ דקות עד שהרוטב מסמיך מעט.<\/li><li><strong>מחברים:<\/strong> מוסיפים את הפסטה, הפרמזן ו־2 כפות ממי הבישול, ומערבבים דקה.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li><strong>לבת 3:<\/strong> לקצוץ את הפטריות קטן מאוד, כדי שיתמזגו ברוטב. כפית גבינת שמנת או עוד פרמזן נותנים טעם עשיר ועדין.<\/li><li>לא לבשל את השמנת יותר מדי. הרוטב צריך להיות מעט נוזלי כשמוסיפים את הפסטה, כי הוא ממשיך להסמיך.<\/li><\/ul>", "text": "\nרוטב עדין שמתאים גם לילדים. הכמות היא לרבע חבילת פסטה (125 גרם). להכפיל לפי הצורך.\n\n   מצרכים\n\n  125 גרם פסטה\n  100–120 גרם פטריות שמפיניון (4–5 פטריות)\n  100 מ״ל שמנת לבישול\n  1 שן שום קטנה כתושה\n  1 כף חמאה או שמן זית\n  2 כפות פרמזן מגורד (לא חובה)\n  מעט מלח\n  קורט פלפל שחור (לא חובה)\n  2–3 כפות ממי בישול הפסטה\n\n   אופן ההכנה\n\n1.   פסטה:   מבשלים במים מומלחים לפי ההוראות. שומרים מעט ממי הבישול לפני הסינון.\n2.   פטריות:   פורסים דק. מחממים חמאה במחבת ומטגנים 5–6 דקות על אש בינונית־גבוהה, עד שהן מתרככות ומשחימות מעט.\n3.   שום:   מוסיפים ומערבבים כ־30 שניות.\n4.   רוטב:   מנמיכים לאש קטנה, מוסיפים שמנת, מלח ופלפל, ומבשלים 3–4 דקות עד שהרוטב מסמיך מעט.\n5.   מחברים:   מוסיפים את הפסטה, הפרמזן ו־2 כפות ממי הבישול, ומערבבים דקה.\n\n   טיפים\n\n    לבת 3:   לקצוץ את הפטריות קטן מאוד, כדי שיתמזגו ברוטב. כפית גבינת שמנת או עוד פרמזן נותנים טעם עשיר ועדין.\n  לא לבשל את השמנת יותר מדי. הרוטב צריך להיות מעט נוזלי כשמוסיפים את הפסטה, כי הוא ממשיך להסמיך.\n"}, {"id": "pashtidat-kishuim-dlaat", "title": "פשטידת קישואים ודלעת", "emoji": "🥧", "tags": ["צמחוני", "חלבי", "פשטידה", "תנור", "לילדים"], "time": "כשעה", "servings": "6", "source": "", "status": "tried", "html": "<p>הדלעת נותנת מתיקות שמאזנת את הקישוא. הסוד לילדים: מרקם חלק, בלי חתיכות ירק מורגשות, והרבה גבינה.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>2 קישואים בינוניים (או זוקיני)<\/li><li>כ־250 גרם דלעת, או חצי דלורית<\/li><li>1 בצל קטן, מגורד דק מאוד (לא חובה)<\/li><li>3 ביצים<\/li><li>1 גביע (250 גרם) גבינה לבנה 5% או קוטג׳<\/li><li>100 גרם גבינה צהובה מגורדת (חופן קטן בצד לציפוי)<\/li><li>5 כפות קמח תופח (או קמח רגיל + ½ כפית אבקת אפייה)<\/li><li>2 כפות שמן זית<\/li><li>½ כפית מלח (ומעט פלפל, אם היא רגילה)<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li><strong>מגרדים וסוחטים:<\/strong> מגרדים קישואים, דלעת ובצל בצד הדק של הפומפייה. סוחטים במסננת עם הידיים. קריטי, כדי שהפשטידה לא תצא רטובה.<\/li><li><strong>בסיס:<\/strong> בקערה מערבבים את הירקות עם ביצים, גבינה לבנה, רוב הגבינה הצהובה, שמן ותבלינים.<\/li><li><strong>קמח:<\/strong> מקפלים פנימה בהדרגה עד שאין גושים.<\/li><li><strong>תבנית:<\/strong> תבנית משומנת (אינגליש קייק או עגולה קטנה). מפזרים מעל את שארית הגבינה הצהובה.<\/li><li><strong>אופים<\/strong> בתנור שחומם ל־180°C, ⁦40–45⁩ דקות, עד שהפשטידה מזהיבה ומתייצבת במרכז.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li><strong>מאפינס אישיים:<\/strong> ילדים אוהבים מנות אישיות. בתבנית מאפינס, כ־25 דקות.<\/li><li><strong>בנינג׳ה:<\/strong> בתבניות סיליקון קטנות, Air Fry, כ־15 דקות.<\/li><li>להניח לפחות 15 דקות לפני הפריסה, כדי שלא תתפרק.<\/li><\/ul>", "text": "\nהדלעת נותנת מתיקות שמאזנת את הקישוא. הסוד לילדים: מרקם חלק, בלי חתיכות ירק מורגשות, והרבה גבינה.\n\n   מצרכים\n\n  2 קישואים בינוניים (או זוקיני)\n  כ־250 גרם דלעת, או חצי דלורית\n  1 בצל קטן, מגורד דק מאוד (לא חובה)\n  3 ביצים\n  1 גביע (250 גרם) גבינה לבנה 5% או קוטג׳\n  100 גרם גבינה צהובה מגורדת (חופן קטן בצד לציפוי)\n  5 כפות קמח תופח (או קמח רגיל + ½ כפית אבקת אפייה)\n  2 כפות שמן זית\n  ½ כפית מלח (ומעט פלפל, אם היא רגילה)\n\n   אופן ההכנה\n\n1.   מגרדים וסוחטים:   מגרדים קישואים, דלעת ובצל בצד הדק של הפומפייה. סוחטים במסננת עם הידיים. קריטי, כדי שהפשטידה לא תצא רטובה.\n2.   בסיס:   בקערה מערבבים את הירקות עם ביצים, גבינה לבנה, רוב הגבינה הצהובה, שמן ותבלינים.\n3.   קמח:   מקפלים פנימה בהדרגה עד שאין גושים.\n4.   תבנית:   תבנית משומנת (אינגליש קייק או עגולה קטנה). מפזרים מעל את שארית הגבינה הצהובה.\n5.   אופים   בתנור שחומם ל־180°C, 40–45 דקות, עד שהפשטידה מזהיבה ומתייצבת במרכז.\n\n   טיפים\n\n    מאפינס אישיים:   ילדים אוהבים מנות אישיות. בתבנית מאפינס, כ־25 דקות.\n    בנינג׳ה:   בתבניות סיליקון קטנות, Air Fry, כ־15 דקות.\n  להניח לפחות 15 דקות לפני הפריסה, כדי שלא תתפרק.\n"}, {"id": "kdeirat-katef-bakar", "title": "קדירת כתף בקר עם תפוחי אדמה, גזר ופטריות", "emoji": "🥘", "tags": ["בשר", "תבשיל", "חורף", "למבוגרים", "לילדים"], "time": "⁦3–3.5⁩ שעות", "servings": "⁦4–5⁩", "source": "https://www.theseasonedmom.com/dutch-oven-beef-stew/", "status": "tried", "html": "<p>תבשיל חורפי בבישול ארוך. הבשר יוצא רך מאוד, כמעט מתפרק, והרוטב מושלם לניגוב עם לחם או להגשה על אורז.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>כ־950 גרם קוביות כתף בקר<\/li><li>2 בצלים גדולים, חתוכים לרצועות<\/li><li>3 גזרים, חתוכים לעיגולים עבים<\/li><li>4 תפוחי אדמה בינוניים, חתוכים לקוביות גדולות<\/li><li>5 שיני שום קצוצות<\/li><li>סלסילת פטריות שמפיניון, חתוכות לחצאים (לא חובה)<\/li><li>2 כפות רסק עגבניות<\/li><li>1 כף פפריקה מתוקה<\/li><li>½ כפית כמון<\/li><li>½ כפית פלפל שחור<\/li><li>1 כפית מלח, ובהמשך לפי הטעם<\/li><li>2 עלי דפנה (אם יש)<\/li><li>½ כוס יין אדום (לא חובה)<\/li><li>⁦2–3⁩ כוסות מים רותחים או ציר בקר<\/li><li>3 כפות שמן זית<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li><strong>צורבים את הבשר (10 דקות):<\/strong> מחממים סיר כבד ורחב עם שמן זית. מייבשים את קוביות הבשר בנייר סופג וצורבים ב־⁦2–3⁩ סבבים, עד השחמה יפה מכל הצדדים. מוציאים לצלחת.<\/li><li><strong>בסיס הרוטב (10 דקות):<\/strong> באותו סיר מטגנים את הבצל כ־7 דקות עד שהוא מזהיב. מוסיפים שום וגזר ומטגנים עוד 2 דקות. מוסיפים רסק, פפריקה וכמון ומערבבים דקה.<\/li><li><strong>מחזירים את הבשר ומוסיפים נוזלים:<\/strong> מחזירים את הבשר עם המיצים שהצטברו. אם משתמשים ביין, מוסיפים עכשיו ומבשלים ⁦2–3⁩ דקות תוך גירוד המשקעים מהתחתית. מוסיפים מים רותחים עד שהם כמעט מכסים את הבשר, ומתבלים במלח, פלפל ועלי דפנה.<\/li><li><strong>בישול ארוך (כשעתיים וחצי):<\/strong> מביאים לרתיחה עדינה, מנמיכים לאש קטנה מאוד ומכסים. מבשלים שעתיים עד שעתיים וחצי, עד שהבשר מתחיל להתרכך. בודקים מדי פעם שיש מספיק נוזלים.<\/li><li><strong>תפוחי אדמה ופטריות (⁦40–50⁩ דקות):<\/strong> כשהבשר כמעט רך, מוסיפים תפוחי אדמה ופטריות. ממשיכים עד שתפוחי האדמה רכים והבשר נחתך בקלות במזלג. מוסיפים מעט מים רותחים אם צריך.<\/li><li><strong>מסמיכים ומגישים:<\/strong> אם יש יותר מדי נוזלים, מסירים את המכסה ל־⁦10–15⁩ דקות. טועמים ומתקנים תיבול.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li>לא לדלג על צריבת הבשר. היא נותנת לרוטב טעם עמוק.<\/li><li>לא למהר: אם אחרי 3 שעות הבשר עדיין קשה, הוא פשוט צריך עוד זמן.<\/li><li>טעים עוד יותר למחרת, אחרי לילה במקרר.<\/li><li><strong>שדרוג:<\/strong> להוסיף עם הגזר 2 גבעולי סלרי, ובמהלך הבישול ענף רוזמרין או כמה ענפי טימין.<\/li><\/ul>", "text": "\nתבשיל toestomahtos.com/2024/10/27/cozy-stewed-meatballs-with-peas/", "status": "tried", "html": "<p>קציצות רכות ועסיסיות ברוטב אדום עם אפונה. טעים מאוד עם אורז לבן או פירה.<\/p>\n<h2>מצרכים<\/h2>\n<h3>לקציצות<\/h3>\n<ul class=\"ingredients\"><li>500 גרם בשר טחון (בקר, או תערובת בקר ועוף)<\/li><li>1 בצל קטן מגורד<\/li><li>1 ביצה<\/li><li>3 כפות פירורי לחם<\/li><li>2 שיני שום כתושות<\/li><li>חופן פטרוזיליה קצוצה (לא חובה)<\/li><li>½ כפית מלח<\/li><li>½ כפית פפריקה מתוקה<\/li><li>מעט פלפל שחור<\/li><li>2 כפות מים<\/li><\/ul>\n<h3>לרוטב האפונה<\/h3>\n<ul class=\"ingredients\"><li>2 כוסות אפונה קפואה<\/li><li>1 בצל בינוני קצוץ<\/li><li>2 שיני שום קצוצות<\/li><li>2 כפות רסק עגבניות<\/li><li>1 עגבנייה מגורדת, או ½ כוס עגבניות מרוסקות<\/li><li>2 כוסות מים<\/li><li>1 כפית פפריקה מתוקה<\/li><li>½ כפית כורכום<\/li><li>½ כפית מלח (או לפי הטעם)<\/li><li>1 כפית סוכר (לא חובה, לאיזון החמיצות)<\/li><li>2 כפות שמן זית<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li><strong>קציצות:<\/strong> מערבבים את כל חומרי הקציצות עד לאיחוד, בלי ללוש יותר מדי. יוצרים כדורים בגודל כדור פינג־פונג בידיים רטובות.<\/li><li><strong>רוטב:<\/strong> מחממים שמן בסיר רחב ומטגנים בצל 5 דקות עד הזהבה קלה. מוסיפים שום, רסק, עגבנייה מגורדת ותבלינים, ומטגנים כדקה.<\/li><li><strong>אפונה ומים:<\/strong> מוסיפים 2 כוסות מים ואת האפונה, ומביאים לרתיחה עדינה.<\/li><li><strong>מבשלים את הקציצות:<\/strong> מניחים אותן בעדינות ברוטב החם, בשכבה אחת ככל האפשר. מכסים ומבשלים על אש נמוכה ⁦25–30⁩ דקות. מנענעים את הסיר מדי פעם במקום לערבב.<\/li><li><strong>מסיימים:<\/strong> אם רוצים רוטב סמיך יותר, מסירים את המכסה ומבשלים עוד 5 דקות. מתקנים תיבול ומגישים עם אורז, קוסקוס או פירה.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li>לא חייבים לטגן את הקציצות. הכנסה ישירה לרוטב שומרת עליהן רכות וחוסכת שמן.<\/li><li><strong>לילדים:<\/strong> חצי גזר מגורד בתוך תערובת הקציצות מוסיף מתיקות ועסיסיות.<\/li><li>לרוטב עשיר יותר: תפוח אדמה קטן בקוביות יחד עם האפונה.<\/li><li>אם הרוטב מצטמצם יותר מדי, מוסיפים מעט מים חמים.<\/li><\/ul>", "text": "\nקציצות רכות ועסיסיות ברוטב אדום עם אפונה. טעים מאוד עם אורז לבן או פירה.\n\n   מצרכים\n\n    לקציצות\n\n  500 גרם בשר טחון (בקר, או תערובת בקר ועוף)\n  1 בצל קטן מגורד\n  1 ביצה\n  3 כפות פירורי לחם\n  2 שיני שום כתושות\n  חופן פטרוזיליה קצוצה (לא חובה)\n  ½ כפית מלח\n  ½ כפית פפריקה מתוקה\n  מעט פלפל שחור\n  2 כפות מים\n\n    לרוטב האפונה\n\n  2 כוסות אפונה קפואה\n  1 בצל בינוני קצוץ\n  2 שיני שום קצוצות\n  2 כפות רסק עגבניות\n  1 עגבנייה מגורדת, או ½ כוס עגבניות מרוסקות\n  2 כוסות מים\n  1 כפית פפריקה מתוקה\n  ½ כפית כורכום\n  ½ כפית מלח (או לפי הטעם)\n  1 כפית סוכר (לא חובה, לאיזון החמיצות)\n  2 כפות שמן זית\n\n   אופן ההכנה\n\n1.   קציצות:   מערבבים את כל חומרי הקציצות עד לאיחוד, בלי ללוש יותר מדי. יוצרים כדורים בגודל כדור פינג־פונג בידיים רטובות.\n2.   רוטב:   מחממים שמן בסיר רחב ומטגנים בצל 5 דקות עד הזהבה קלה. מוסיפים שום, רסק, עגבנייה מגורדת ותבלינים, ומטגנים כדקה.\n3.   אפונה ומים:   מוסיפים 2 כוסות מים ואת האפונה, ומביאים לרתיחה עדינה.\n4.   מבשלים את הקציצות:   מניחים אותן בעדינות ברוטב החם, בשכבה אחת ככל האפשר. מכסים ומבשלים על אש נמוכה 25–30 דקות. מנענעים את הסיר מדי פעם במקום לערבב.\n5.   מסיימים:   אם רוצים רוטב סמיך יותר, מסירים את המכסה ומבשלים עוד 5 דקות. מתקנים תיבול ומגישים עם אורז, קוסקוס או פירה.\n\n   טיפים\n\n  לא חייבים לטגן את הקציצות. הכנסה ישירה לרוטב שומרת עליהן רכות וחוסכת שמן.\n    לילדים:   חצי גזר מגורד בתוך תערובת הקציצות מוסיף מתיקות ועסיסיות.\n  לרוטב עשיר יותר: תפוח אדמה קטן בקוביות יחד עם האפונה.\n  אם הרוטב מצטמצם יותר מדי, מוסיפים מעט מים חמים.\n"}, {"id": "ktzitzot-yerek", "title": "קציצות ירק עם תפוח אדמה, זוקיני ובצל", "emoji": "🥔", "tags": ["צמחוני", "קציצות", "תנור", "לילדים"], "time": "⁦30–35⁩ דקות", "servings": "⁦12–15⁩ קציצות", "source": "", "status": "tried", "html": "<p>רכות מבפנים, מעט פריכות מבחוץ. בתנור או במחבת.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>2 תפוחי אדמה בינוניים<\/li><li>1 זוקיני גדול (או 2 קטנים)<\/li><li>1 בצל בינוני<\/li><li>1 ביצה<\/li><li>⁦3–4⁩ כפות קמח רגיל או פירורי לחם<\/li><li>2 כפות שמן זי  עם יוגורט, גבינה לבנה או טחינה.\n"}, {"id": "sheuit-yeruka", "title": "שעועית ירוקה מוקפצת מתקתקה", "emoji": "🫛", "tags": ["צמחוני", "תוספת", "מהיר", "לילדים"], "time": "15 דקות", "servings": "⁦3–4⁩", "source": "", "status": "tried", "html": "<p>שעועית ירוקה קפואה, עדינה ומעט מתקתקה, בלי רוטב עגבניות.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>500 גרם שעועית ירוקה קפואה<\/li><li>2 כפות שמן זית<\/li><li>1 שן שום כתושה (לא חובה)<\/li><li>1 כפית סילאן או דבש<\/li><li>1 כפית רוטב סויה (לא חובה)<\/li><li>מעט מלח<\/li><li>1 כף מים<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li><strong>מרככים:<\/strong> מבשלים את השעועית במים רותחים ⁦4–5⁩ דקות ומסננים היטב.<\/li><li>מחממים שמן זית במחבת על אש בינונית־גבוהה.<\/li><li><strong>מקפיצים<\/strong> את השעועית ⁦4–5⁩ דקות, עד שהיא מקבלת מעט צבע.<\/li><li><strong>מתבלים:<\/strong> שום, סילאן, סויה וכף מים. מערבבים היטב.<\/li><li>מקפיצים עוד ⁦1–2⁩ דקות, עד שהשעועית מבריקה ומצופה.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li>למרקם רך יותר: לבשל ⁦7–8⁩ דקות בשלב הראשון.<\/li><li>לילדים שלא אוהבים שום: לוותר עליו.<\/li><li>לבת 3: לחתוך לחתיכות קטנות.<\/li><\/ul>", "text": "\nשעועית ירוקה קפואה, עדינה ומעט מתקתקה, בלי רוטב עגבניות.\n\n   מצרכים\n\n  500 גרם שעועית ירוקה קפואה\n  2 כפות שמן זית\n  1 שן שום כתושה (לא חובה)\n  1 כפית סילאן או דבש\n  1 כפית רוטב סויה (לא חובה)\n  מעט מלח\n  1 כף מים\n\n   אופן ההכנה\n\n1.   מרככים:   מבשלים את השעועית במים רותחים 4–5 דקות ומסננים היטב.\n2. מחממים שמן זית במחבת על אש בינונית־גבוהה.\n3.   מקפיצים   את השעועית 4–5 דקות, עד שהיא מקבלת מעט צבע.\n4.   מתבלים:   שום, סילאן, סויה וכף מים. מערבבים היטב.\n5. מקפיצים עוד 1–2 דקות, עד שהשעועית מבריקה ומצופה.\n\n   טיפים\n\n  למרקם רך יותר: לבשל 7–8 דקות בשלב הראשון.\n  לילדים שלא אוהבים שום: לוותר עליו.\n  לבת 3: לחתוך לחתיכות קטנות.\n"}, {"id": "tavshil-basar-tahun-tapuhei-adama-afuna", "title": "תבשיל בשר טחון עם תפוחי אדמה ואפונה", "emoji": "🍲", "tags": ["בשר", "סיר אחד", "לילדים"], "time": "35 דקות", "servings": "⁦3–4⁩", "source": "", "status": "tried", "html": "<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>426 גרם בשר בקר טחון (קופסה שלמה)<\/li><li>1 בצל גדול קצוץ<\/li><li>2 שיני שום כתושות<\/li><li>2 תפוחי אדמה בינוניים, חתוכים לקוביות קטנות<\/li><li>1 כוס אפונה קפואה<\/li><li>2 כפות רסק עגבניות<\/li><li>1 כפית פפריקה מתוקה<\/li><li>¼ כפית כמון (לא חובה)<\/li><li>מלח ופלפל לפי הטעם<\/li><li>⁦1–1.5⁩ כוסות מים<\/li><li>2 כפות שמן זית<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li><strong>מטגנים בצל:<\/strong> מחממים שמן בסיר רחב ומטגנים את הבצל כ־5 דקות, עד שהוא מזהיב קלות.<\/li><li><strong>מוסיפים בשר:<\/strong> מוסיפים את הבשר הטחון ומפוררים בכף עץ. מטגנים ⁦5–7⁩ דקות, עד שהבשר משנה צבע ומשחים מעט.<\/li><li><strong>מתבלים:<\/strong> מוסיפים שום, רסק עגבניות, פפריקה, כמון, מלח ופלפל, ומערבבים כדקה.<\/li><li><strong>מוסיפים תפוחי אדמה:<\/strong> מכניסים את קוביות תפוחי האדמה ומערבבים היטב עם הבשר.<\/li><li><strong>מבשלים:<\/strong> מוסיפים מים עד כיסוי חלקי, מכסים ומבשלים כ־15 דקות על אש בינונית־נמוכה.<\/li><li><strong>מוסיפים אפונה:<\/strong> מבשלים עוד ⁦7–10⁩ דקות, עד שתפוחי האדמה רכים והרוטב מסמיך.<\/li><\/ol>", "text": "\n   מצרכים\n\n  426 גרם בשר בקר טחון (קופסה שלמה)\n  1 בצל גדול קצוץ\n  2 שיני שום כתושות\n  2 תפוחי אדמה בינוניים, חתוכים לקוביות קטנות\n  1 כוס אפונה קפואה\n  2 כפות רסק עגבניות\n  1 כפית פפריקה מתוקה\n  ¼ כפית כמון (לא חובה)\n  מלח ופלפל לפי הטעם\n  1–1.5 כוסות מים\n  2 כפות שמן זית\n\n   אופן ההכנה\n\n1.   מטגנים בצל:   מחממים שמן בסיר רחב ומטגנים את הבצל כ־5 דקות, עד שהוא מזהיב קלות.\n2.   מוסיפים בשר:   מוסיפים את הבשר הטחון ומפוררים בכף עץ. מטגנים 5–7 דקות, עד שהבשר משנה צבע ומשחים מעט.\n3.   מתבלים:   מוסיפים שום, רסק עגבניות, פפריקה, כמון, מלח ופלפל, ומערבבים כדקה.\n4.   מוסיפים תפוחי אדמה:   מכניסים את קוביות תפוחי האדמה ומערבבים היטב עם הבשר.\n5.   מבשלים:   מוסיפים מים עד כיסוי חלקי, מכסים ומבשלים כ־15 דקות על אש בינונית־נמוכה.\n6.   מוסיפים אפונה:   מבשלים עוד 7–10 דקות, עד שתפוחי האדמה רכים והרוטב מסמיך.\n"}, {"id": "orez-sheuit-of", "title": "אורז, שעועית ירוקה וחזה עוף צרוב", "emoji": "🍱", "tags": ["עוף", "אורז", "מהיר", "לילדים", "למבוגרים"], "time": "30 דקות", "servings": "⁦3–4⁩", "source": "https://www.kipa.co.il/%D7%90%D7%95%D7%9B%D7%9C/1214688-0/", "status": "new", "html": "<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>1.5 כוסות אורז<\/li><li>400 גרם שעועית ירוקה קפואה<\/li><li>500 גרם חזה עוף, ברצועות<\/li><li>2 כפות טריאקי<\/li><li>1 כף סויה, ועוד מעט לשעועית<\/li><li>½ כפית פפריקה מתוקה<\/li><li>½ כפית שום גבישי<\/li><li>⁦2–3⁩ כפות שמן<\/li><li>מלח<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li>מבשלים את האורז כרגיל.<\/li><li>מערבבים את רצועות העוף עם טריאקי, סויה, פפריקה ושום.<\/li><li>במחבת חמה עם כף שמן, מקפיצים את השעועית ⁦5–6⁩ דקות על אש גבוהה. מתבלים במעט סויה ומלח, ומוציאים.<\/li><li>באותה מחבת, עם עוד שמן, צורבים את העוף ⁦2–3⁩ דקות מכל צד עד שהוא מוכן.<\/li><li>מגישים אורז, שעועית ועוף.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li><strong>לילדים:<\/strong> חצי כמות טריאקי וכפית סילאן במקומה.<\/li><\/ul>", "text": "\n   מצרכים\n\n  1.5 כוסות אורז\n  400 גרם שעועית ירוקה קפואה\n  500 גרם חזה עוף, ברצועות\n  2 כפות טריאקי\n  1 כף סויה, ועוד מעט לשעועית\n  ½ כפית פפריקה מתוקה\n  ½ כפית שום גבישי\n  2–3 כפות שמן\n  מלח\n\n   אופן ההכנה\n\n1. מבשלים את האורז כרגיל.\n2. מערבבים את רצועות העוף עם טריאקי, סויה, פפריקה ושום.\n3. במחבת חמה עם כף שמן, מקפיצים את השעועית 5–6 דקות על אש גבוהה. מתבלים במעט סויה ומלח, ומוציאים.\n4. באותה מחבת, עם עוד שמן, צורבים את העוף 2–3 דקות מכל צד עד שהוא מוכן.\n5. מגישים אורז, שעועית ועוף.\n\n   טיפים\n\n    לילדים:   חצי כמות טריאקי וכפית סילאן במקומה.\n"}, {"id": "glidat-banana", "title": "גלידת בננה ביתית (3 טעמים)", "emoji": "🍌", "tags": ["קינוח", "טבעוני", "מהיר", "לילדים"], "time": "5 דקות", "servings": "3", "source": "https://www.ynet.co.il/menta/article/hyan113q52", "status": "new", "html": "<p>גלידה בלי סוכר מוסף, מבננות קפואות ותמרים.<\/p>\n<h2>מצרכים<\/h2>\n<h3>בסיס<\/h3>\n<ul class=\"ingredients\"><li>2 בננות בשלות, פרוסות וקפואות<\/li><li>2 תמרי מג׳הול מגולענים<\/li><\/ul>\n<h3>לבחירה<\/h3>\n<ul class=\"ingredients\"><li><strong>שוקולד:<\/strong> 1 כף גדושה קקאו<\/li><li><strong>חלבה:<\/strong> ⅓ כוס טחינה גולמית<\/li><li><strong>תות־בננה:<\/strong> 1 כוס תותים קפואים<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li>טוחנים במעבד מזון חזק את הבננות והתמרים, עם התוספת שבחרתם.<\/li><li>מגרדים את הדפנות מדי פעם, עד שמתקבל מרקם חלק של גלידה רכה.<\/li><li>מגישים מיד, או מקפיאים 30 דקות למרקם מוצק יותר.<\/li><\/ol>", "text": "\nגלידה בלי סוכר מוסף, מבננות קפואות ותמרים.\n\n   מצרכים\n\n    בסיס\n\n  2 בננות בשלות, פרוסות וקפואות\n  2 תמרי מג׳הול מגולענים\n\n    לבחירה\n\n    שוקולד:   1 כף גדושה קקאו\n    חלבה:   ⅓ כוס טחינה גולמית\n    תות־בננה:   1 כוס תותים קפואים\n\n   אופן ההכנה\n\n1. טוחנים במעבד מזון חזק את הבננות והתמרים, עם התוספת שבחרתם.\n2. מגרדים את הדפנות מדי פעם, עד שמתקבל מרקם חלק של גלידה רכה.\n3. מגישים מיד, או מקפיאים 30 דקות למרקם מוצק יותר.\n"}, {"id": "dag-yerakot-tanur", "title": "דג לבן וירקות בתנור", "emoji": "🐟", "tags": ["דגים", "תנור", "תבנית אחת", "מהיר", "לילדים", "למבוגרים"], "time": "30 דקות", "servings": "⁦3–4⁩", "source": "https://www.kipa.co.il/%D7%90%D7%95%D7%9B%D7%9C/1214688-0/", "status": "new", "html": "<p>ארוחה בתבנית אחת, עם ירקות קפואים מהמקפיא.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>⁦3–4⁩ פילה דג לבן (אמנון, מוסר או בקלה)<\/li><li>500 גרם ירקות קפואים (ברוקולי, כרובית, גזר, פלפלים)<\/li><li>3 כפות שמן זית<\/li><li>½ כפית שום גבישי<\/li><li>½ כפית אורגנו<\/li><li>½ כפית פפריקה מתוקה<\/li><li>מלח ופלפל<\/li><li>½ לימון<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li>מחממים תנור ל־200°C.<\/li><li>מפזרים את הירקות בתבנית, מערבבים עם 2 כפות שמן, שום, אורגנו, מלח ופלפל, ואופים 10 דקות.<\/li><li>מניחים את הפילה מעל הירקות, מורחים בשאר השמן ומפזרים פפריקה ומלח.<\/li><li>אופים עוד ⁦12–15⁩ דקות, עד שהדג מתפרק בקלות.<\/li><li>סוחטים לימון מעל ומגישים.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li><strong>לילדים:<\/strong> לבדוק עצמות, ולהגיש את הדג מפורק עם אורז או פירה.<\/li><\/ul>", "text": "\nארוחה בתבנית אחת, עם ירקות קפואים מהמקפיא.\n\n   מצרכים\n\n  3–4 פילה דג לבן (אמנון, מוסר או בקלה)\n  500 גרם ירקות קפואים (ברוקולי, כרובית, גזר, פלפלים)\n  3 כפות שמן זית\n  ½ כפית שום גבישי\n  ½ כפית אורגנו\n  ½ כפית פפריקה מתוקה\n  מלח ופלפל\n  ½ לימון\n\n   אופן ההכנה\n\n1. מחממים תנור ל־200°C.\n2. מפזרים את הירקות בתבנית, מערבבים עם 2 כפות שמן, שום, אורגנו, מלח ופלפל, ואופים 10 דקות.\n3. מניחים את הפילה מעל הירקות, מורחים בשאר השמן ומפזרים פפריקה ומלח.\n4. אופים עוד 12–15 דקות, עד שהדג מתפרק בקלות.\n5. סוחטים לימון מעל ומגישים.\n\n   טיפים\n\n    לילדים:   לבדוק עצמות, ולהגיש את הדג מפורק עם אורז או פירה.\n"}, {"id": "levivot-adashim", "title": "לביבות עדשים כתומות אפויות", "emoji": "🟠", "tags": ["צמחוני", "טבעוני", "קציצות", "תנור", "לילדים"], "time": "שעה (כולל השריה)", "servings": "⁦20–22⁩ לביבות", "source": "https://www.maccabi4u.co.il/maccabi_circles/healthy-and-tasty/lentil_fritters/", "status": "new", "html": "<p>לביבות קטנות בגודל אצבע, מתאימות גם לפעוטות. מתכון מאתר מכבי.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>1 כוס עדשים כתומות<\/li><li>½ כוס אפונה (טרייה או מופשרת)<\/li><li>1 גזר בינוני מגורד<\/li><li>1 זוקיני בינוני מגורד וסחוט<\/li><li>¾ כוס שיבולת שועל דקה<\/li><li>¼ כוס קמח עדשים (או קמח רגיל)<\/li><li>½ כפית מלח<\/li><li>¼ כפית פלפל שחור<\/li><li>⁦2–3⁩ כפות שמן קנולה, או ספריי<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li>משרים את העדשים במים רותחים 30 דקות ומסננים.<\/li><li>מחממים תנור ל־190°C ומרפדים תבנית בנייר אפייה.<\/li><li>טוחנים את העדשים לעיסה חלקה.<\/li><li>מוסיפים את כל השאר חוץ מהשמן, ומערבבים לבלילה דביקה.<\/li><li>יוצרים לביבות שטוחות ומסדרים בתבנית. מברישים בשמן.<\/li><li>אופים כ־30 דקות, והופכים אחרי 15.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li>מגישים עם יוגורט או טחינה לטבילה.<\/li><li>לתינוקות מתחת לשנה: מקובל לוותר על המלח.<\/li><\/ul>", "text": "\nלביבות קטנות בגודל אצבע, מתאימות גם לפעוטות. מתכון מאתר מכבי.\n\n   מצרכים\n\n  1 כוס עדשים כתומות\n  ½ כוס אפונה (טרייה או מופשרת)\n  1 גזר בינוני מגורד\n  1 זוקיני בינוני מגורד וסחוט\n  ¾ כוס שיבולת שועל דקה\n  ¼ כוס קמח עדשים (או קמח רגיל)\n  ½ כפית מלח\n  ¼ כפית פלפל שחור\n  2–3 כפות שמן קנולה, או ספריי\n\n   אופן ההכנה\n\n1. משרים את העדשים במים רותחים 30 דקות ומסננים.\n2. מחממים תנור ל־190°C ומרפדים תבנית בנייר אפייה.\n3. טוחנים את העדשים לעיסה חלקה.\n4. מוסיפים את כל השאר חוץ מהשמן, ומערבבים לבלילה דביקה.\n5. יוצרים לביבות שטוחות ומסדרים בתבנית. מברישים בשמן.\n6. אופים כ־30 דקות, והופכים אחרי 15.\n\n   טיפים\n\n  מגישים עם יוגורט או טחינה לטבילה.\n  לתינוקות מתחת לשנה: מקובל לוותר על המלח.\n"}, {"id": "pasta-agvaniyot-pshuta", "title": "פסטה ברוטב עגבניות פשוט", "emoji": "🍅", "tags": ["צמחוני", "פסטה", "מהיר", "לילדים"], "time": "20 דקות", "servings": "4", "source": "https://www.mako.co.il/food-cooking_magazine/Article-2ba689004556f61026.htm", "status": "new", "html": "<p>הרוטב הכי בסיסי: הכול לסיר, עשר דקות רתיחה.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>500 גרם ספגטי (או כל פסטה)<\/li><li>800 גרם עגבניות מרוסקות<\/li><li>⁦3–4⁩ שיני שום כתושות<\/li><li>1 כפית אורגנו יבש<\/li><li>גבעול בזיליקום עם העלים (לא חובה)<\/li><li>1.5 כפיות מלח<\/li><li>1 כף סוכר<\/li><li>2 כפות שמן זית<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li>מבשלים את הפסטה במים מומלחים לפי ההוראות.<\/li><li>בינתיים, שמים בסיר את העגבניות, השום, האורגנו, הבזיליקום, המלח, הסוכר והשמן.<\/li><li>מביאים לרתיחה ומבשלים כ־10 דקות בבעבוע, עם ערבוב מדי פעם.<\/li><li>מוציאים את גבעול הבזיליקום, מערבבים עם הפסטה ומגישים.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li><strong>לילדים:<\/strong> פחות שום, ומגורדת מעל גבינה צהובה או פרמזן.<\/li><li>חצי גזר מגורד שמתבשל ברוטב מוסיף מתיקות.<\/li><\/ul>", "text": "\nהרוטב הכי בסיסי: הכול לסיר, עשר דקות רתיחה.\n\n   מצרכים\n\n  500 גרם ספגטי (או כל פסטה)\n  800 גרם עגבניות מרוסקות\n  3–4 שיני שום כתושות\n  1 כפית אורגנו יבש\n  גבעול בזיליקום עם העלים (לא חובה)\n  1.5 כפיות מלח\n  1 כף סוכר\n  2 כפות שמן זית\n\n   אופן ההכנה\n\n1. מבשלים את הפסטה במים מומלחים לפי ההוראות.\n2. בינתיים, שמים בסיר את העגבניות, השום, האורגנו, הבזיליקום, המלח, הסוכר והשמן.\n3. מביאים לרתיחה ם עוד 5 דקות.\n\n   וריאציות\n\n    פתיתים מתוקים:   עם הפתיתים מטגנים 2 כפות אפונה, ועם המים מוסיפים 3 כפות צימוקים או שזיפים מיובשים קצוצים.\n    פתיתי רמזור:   מכפילים את הכמות. בנפרד מקפיצים 3 פלפלים צבעוניים קצוצים (אדום, צהוב, ירוק) כ־10 דקות עם 2 כפיות סויה, ואז מערבבים עם הפתיתים המוכנים ומקפיצים יחד 5 דקות.\n"}, {"id": "kdeirat-orez-of-yerakot", "title": "קדירת אורז עם עוף וירקות", "emoji": "🍛", "tags": ["עוף", "אורז", "סיר אחד", "לילדים", "למבוגרים"], "time": "45 דקות", "servings": "4", "source": "https://www.kipa.co.il/אוכל/1213567-0/", "status": "new", "html": "<p>ארוחה שלמה בסיר אחד: עוף, אורז וירקות.<\/p>\n<h2>מצרכים<\/h2>\n<ul class=\"ingredients\"><li>2 כרעיים מפורקות, או 500 גרם חזה/פרגית בקוביות<\/li><li>1 בצל קצוץ<\/li><li>2 גזרים קצוצים<\/li><li>1 קישוא בקוביות<\/li><li>1.5 כוסות אורז, שטוף<\/li><li>3 כוסות מים רותחים<\/li><li>2 כפות שמן<\/li><li>½ כפית כורכום<\/li><li>1 כפית פפריקה מתוקה<\/li><li>½ כפית כמון<\/li><li>1.5 כפיות מלח, ומעט פלפל<\/li><\/ul>\n<h2>אופן ההכנה<\/h2>\n<ol><li>מטגנים את הבצל בשמן עד שהוא מזהיב.<\/li><li>מוסיפים את העוף וצורבים מכל הצדדים.<\/li><li>מוסיפים גזר וקישוא ומטגנים 5 דקות.<\/li><li>מוסיפים את האורז והתבלינים ומערבבים דקה.<\/li><li>מוסיפים מים רותחים, מביאים לרתיחה, מכסים ומבשלים על אש נמוכה כ־25 דקות.<\/li><li>מכבים ומשאירים מכוסה 10 דקות לפני שמאווררים.<\/li><\/ol>\n<h2>טיפים<\/h2>\n<ul><li>עם כרעיים עם עצם: לצרוב אותן היטב ולבשל 10 דקות במים לפני שמוסיפים את האורז.<\/li><\/ul>", "text": "\nארוחה שלמה בסיר אחד: עוף, אורז וירקות.\n\n   מצרכים\n\n  2 כרעיים מפורקות, או 500 גרם חזה/פרגית בקוביות\n  1 בצל קצוץ\n  2 גזרים קצוצים\n  1 קישוא בקוביות\n  1.5 כוסות אורז, שטוף\n  3 כוסות מים רותחים\n  2 כפות שמן\n  ½ כפית כורכום\n  1 כפית פפריקה מתוקה\n  ½ כפית כמון\n  1.5 כפיות מלח, ומעט פלפל\n\n   אופן ההכנה\n\n1. מטגנים את הבצל בשמן עד שהוא מזהיב.\n2. מוסיפים את העוף וצורבים מכל הצדדים.\n3. מוסיפים גזר וקישוא ומטגנים 5 דקות.\n4. מוסיפים את האורז והתבלינים ומערבבים דקה.\n5. מוסיפים מים רותחים, מביאים לרתיחה, מכסים ומבשלי   if (t === "ניסינו ואהבנו" && r.status !== "tried") return false;
  if (t === "חדש לנסות" && r.status === "tried") return false;
  if (!["הכול", "ניסינו ואהבנו", "חדש לנסות"].includes(t) && !r.tags.includes(t)) return false;
  if (!state.q) return true;
  const hay = (r.title + " " + r.tags.join(" ") + " " + r.text).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function renderList() {
  document.title = "מה מבשלים";
  const tried = RECIPES.filter(r => r.status === "tried").length;
  app.innerHTML = `
    <header>
      <h1>מה מבשלים <small>${RECIPES.length} מתכונים · ${tried} ניסינו</small></h1>
      <input type="search" id="q" placeholder="חיפוש: פתיתים, אפונה, נינג׳ה…" value="${esc(state.q)}" autocomplete="off">
      <div class="chips">${FILTERS.map(f => `<button class="chip" aria-pressed="${f === state.tag}" data-tag="${f}">${f}</button>`).join("")}</div>
    </header>
    <ul class="list" id="list"></ul>`;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.q = q.value.trim(); fill(); });
  app.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    state.tag = b.dataset.tag; store.set("tag", state.tag);
    app.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    fill();
  }));
  fill();
}

function fill() {
  const items = RECIPES.filter(matches);
  document.getElementById("list").innerHTML = items.length ? items.map(r => `
    <li><a class="card" href="#/${r.id}">
      <span class="emoji">${r.emoji}</span>
      <span>
        <div class="title">${esc(r.title)}</div>
        <div class="meta">
          <span class="badge ${r.status === "tried" ? "" : "new"}">${r.status === "tried" ? "ניסינו ✓" : "חדש"}</span>
          ${r.time ? `<span>⏱ ${esc(r.time)}</span>` : ""}
          ${r.servings ? `<span>🍽 ${esc(r.servings)}</span>` : ""}
        </div>
      </span>
    </a></li>`).join("") : `<li class="empty">לא נמצאו מתכונים</li>`;
}

let wakeLock = null;
async function toggleWake(btn) {
  try {
    if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    else { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; btn.setAttribute("aria-pressed", "false"); }); }
    btn.setAttribute("aria-pressed", String(!!wakeLock));
  } catch { btn.textContent = "לא נתמך"; }
}

function renderRecipe(r) {
  document.title = r.title;
  window.scrollTo(0, 0);
  const checked = store.get("chk:" + r.id, []);
  app.innerHTML = `
    <div class="recipe">
      <div class="bar">
        <a class="btn" href="#/">→ כל המתכונים</a>
        <span class="spacer"></span>
        ${"wakeLock" in navigator ? `<button class="btn" id="wake" aria-pressed="false">☀️ מסך דלוק</button>` : ""}
        <button class="btn" id="share">שיתוף</button>
      </div>
      <h1>${r.emoji} ${esc(r.title)}</h1>
      <div class="meta">
        <span class="badge ${r.status === "tried" ? "" : "new"}">${r.status === "tried" ? "ניסינו ✓" : "חדש לנסות"}</span>
        ${r.time ? `<span>⏱ ${esc(r.time)}</span>` : ""}
        ${r.servings ? `<span>🍽 ${esc(r.servings)}</span>` : ""}
      </div>
      <div class="tags">${r.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
      ${r.html}
      ${r.source ? `<p class="source">מקור: <a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(new URL(r.source).hostname.replace(/^www\./, ""))}</a></p>` : ""}
      <p class="hint">טיפ: אפשר לסמן מצרכים שכבר הוצאתם בלחיצה.</p>
    </div>`;
  app.querySelectorAll("ul.ingredients li").forEach((li, i) => {
    if (checked.includes(i)) li.classList.add("done");
    li.addEventListener("click", () => {
      li.classList.toggle("done");
      const now = [...app.querySelectorAll("ul.ingredients li")].flatMap((x, j) => x.classList.contains("done") ? [j] : []);
      store.set("chk:" + r.id, now);
    });
  });
  const wake = document.getElementById("wake");
  if (wake) wake.addEventListener("click", () => toggleWake(wake));
  document.getElementById("share").addEventListener("click", async () => {
    const url = location.href;
    if (navigator.share) { try { await navigator.share({ title: r.title, url }); } catch {} }
    else { try { await navigator.clipboard.writeText(url); document.getElementById("share").textContent = "הקישור הועתק"; } catch {} }
  });
}

function route() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const r = RECIPES.find(x => x.id === id);
  r ? renderRecipe(r) : renderList();
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
